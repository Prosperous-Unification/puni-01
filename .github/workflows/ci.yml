name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: gate
        timeout-minutes: 2
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          PUSHED_BEFORE: ${{ github.event.before }}
          PUSHED_AFTER: ${{ github.event.after }}
        # A push to main is judged whole, then every commit it brought; the full history fetched
        # above holds the range. A merge group holds pull request commits already judged so.
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            bun run gate
            git cat-file -e "$PUSHED_BEFORE^{commit}"
            bun run puni burokrat check --commits "$PUSHED_BEFORE..$PUSHED_AFTER"
            exit
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            bun run gate
            exit
          fi
          git cat-file -e "$NX_BASE^{commit}"
          bun run gate:affected
